<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D 列印模型排程佇列 (PC & 手機即時同步) | 3D Print Queue</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#6366f1',
              600: '#4f46e5',
            }
          }
        }
      }
    }
  </script>
  <!-- QR Code 產生庫 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link rel="stylesheet" href="style.css?v=20261127_02">
</head>
<body class="min-h-screen text-slate-800 antialiased selection:bg-indigo-500 selection:text-white pb-24">

  <!-- 頂部導航列：懸浮液態玻璃膠囊 -->
  <header class="sticky top-0 z-30 py-3 px-4 sm:px-6">
    <div class="max-w-6xl mx-auto liquid-glass-panel px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
      <!-- 品牌標題 -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-violet-600 via-indigo-500 to-cyan-400 flex items-center justify-center shadow-lg shadow-indigo-500/20 shrink-0 border border-white/60">
          <svg class="w-5 h-5 text-white drop-shadow-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
          </svg>
        </div>
        <h1 class="text-base sm:text-lg font-extrabold tracking-tight text-slate-900">
          3D Print Queue
        </h1>
      </div>

      <!-- 視圖切換器 (排程佇列 與 完工歷史) -->
      <div class="flex items-center bg-white/50 backdrop-blur-md p-1 rounded-full border border-white/80 shadow-inner order-3 sm:order-2 w-full sm:w-auto justify-center">
        <button data-view="queue" class="view-tab-btn flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-4 py-1.5 rounded-full text-xs font-semibold liquid-pill-violet shadow-sm">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
          排程佇列
        </button>
        <button data-view="history" class="view-tab-btn flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-4 py-1.5 rounded-full text-xs font-semibold text-slate-600 hover:text-slate-900 transition-all">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          完工歷史
        </button>
      </div>

      <!-- 操作按鈕群 -->
      <div class="flex items-center gap-2 order-2 sm:order-3 ml-auto sm:ml-0">
        <button id="btn-add-job" class="liquid-pill-violet px-4 py-2 text-xs font-semibold flex items-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
          排入待印模型
        </button>

        <!-- 工具下拉選單 -->
        <div class="relative group">
          <button class="liquid-pill-glass p-2">
            <svg class="w-4 h-4 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"></path></svg>
          </button>
          <div class="absolute right-0 mt-2 w-48 bg-white/95 backdrop-blur-xl border border-white/90 rounded-2xl shadow-2xl py-2 hidden group-hover:block z-40">
            <button id="btn-cloud-sync-modal" class="w-full text-left px-3.5 py-2 text-xs text-indigo-600 font-semibold hover:bg-slate-100/80 flex items-center gap-2">
              <svg class="w-4 h-4 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
              手機同步 / QR Code
            </button>
            <div class="h-px bg-slate-200/80 my-1"></div>
            <button id="btn-export-csv" class="w-full text-left px-3.5 py-2 text-xs text-slate-700 hover:bg-slate-100/80 flex items-center gap-2">
              <svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
              匯出 CSV 報表
            </button>
            <button id="btn-export-json" class="w-full text-left px-3.5 py-2 text-xs text-slate-700 hover:bg-slate-100/80 flex items-center gap-2">
              <svg class="w-4 h-4 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
              匯出 JSON 備份
            </button>
            <button id="btn-import-trigger" class="w-full text-left px-3.5 py-2 text-xs text-slate-700 hover:bg-slate-100/80 flex items-center gap-2">
              <svg class="w-4 h-4 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
              匯入 JSON 還原
            </button>
            <div class="h-px bg-slate-200/80 my-1"></div>
            <button id="btn-clear-all" class="w-full text-left px-3.5 py-2 text-xs text-rose-600 hover:bg-rose-50 flex items-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
              清空所有排程 (清成空白)
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <input type="file" id="import-file-input" accept=".json" class="hidden">

  <main class="max-w-6xl mx-auto px-4 sm:px-6 pt-3 space-y-4">

    <!-- 視圖 1: 排程佇列清單 (Queue View) -->
    <section id="view-queue" class="view-panel space-y-3">
      <div id="queue-list-container" class="space-y-3.5">
        <!-- 由 app.js 動態渲染 -->
      </div>
    </section>

    <!-- 視圖 2: 完工歷史表格 (History View) -->
    <section id="view-history" class="view-panel hidden">
      <div class="liquid-glass-panel overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-white/40 border-b border-white/80 text-[11px] uppercase tracking-wider text-slate-600 font-bold">
                <th class="py-3 px-4">模型名稱</th>
                <th class="py-3 px-4">提需求人員</th>
                <th class="py-3 px-4">3D檔案提供者</th>
                <th class="py-3 px-4">使用目的</th>
                <th class="py-3 px-4">需求日期</th>
                <th class="py-3 px-4 text-right">操作</th>
              </tr>
            </thead>
            <tbody id="history-table-body" class="divide-y divide-white/60">
              <!-- 由 app.js 動態渲染 -->
            </tbody>
          </table>
        </div>
      </div>
    </section>

  </main>

  <!-- ==================== 對話框 MODALS ==================== -->

  <!-- 工單新增 / 編輯 Modal -->
  <div id="job-modal" class="modal-backdrop fixed inset-0 z-50 bg-slate-900/35 backdrop-blur-md flex items-center justify-center p-4 hidden">
    <div class="modal-content-card liquid-glass-panel max-w-lg w-full p-5 sm:p-6 relative max-h-[90vh] overflow-y-auto bg-white/75">
      <div class="flex items-center justify-between pb-3 mb-4 border-b border-white/80">
        <h3 id="job-modal-title" class="text-base font-extrabold text-slate-900">排入待列印模型</h3>
        <button type="button" class="modal-close-btn text-slate-500 hover:text-slate-800 p-1.5 rounded-full hover:bg-white/60 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <form id="job-form" class="space-y-3.5">
        <input type="hidden" id="job-id-input">

        <!-- 1. 模型名稱 -->
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">模型名稱 / 零件標題 *</label>
          <input type="text" id="job-name-input" required placeholder="例如：外殼上蓋、機構連桿樣品..." class="w-full liquid-input px-3.5 py-2 text-sm">
        </div>

        <!-- 2. 提需求人員 & 3. 3D檔案提供者 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">提需求的人員 *</label>
            <input type="text" id="job-requester-input" required placeholder="例如：Kevin (產品組)" class="w-full liquid-input px-3.5 py-2 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">3D檔案提供者 *</label>
            <input type="text" id="job-provider-input" required placeholder="例如：Sarah (設計組)" class="w-full liquid-input px-3.5 py-2 text-sm">
          </div>
        </div>

        <!-- 4. 使用目的 -->
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">使用目的 (用途說明)</label>
          <input type="text" id="job-purpose-input" placeholder="例如：機構干涉驗證、客戶外觀樣品、產線夾治具..." class="w-full liquid-input px-3.5 py-2 text-sm">
        </div>

        <!-- 需求日期 (可選日期或勾選「待定」) -->
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">需求日期 (期望交期)</label>
          <div class="flex items-center gap-2.5">
            <input type="date" id="job-duedate-input" class="flex-1 liquid-input px-3.5 py-2 text-sm font-mono">
            <label class="flex items-center justify-center gap-1.5 px-3.5 py-2 rounded-xl bg-white/70 border border-white/90 cursor-pointer hover:bg-white shadow-sm transition-all has-[:checked]:bg-indigo-600 has-[:checked]:border-indigo-600 has-[:checked]:text-white shrink-0">
              <input type="checkbox" id="job-duedate-tbd" class="accent-indigo-500 w-4 h-4 rounded">
              <span class="text-xs font-bold">待定</span>
            </label>
          </div>
        </div>

        <!-- 材料選擇 (可複選) -->
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">材料選擇 (可複選) *</label>
          <div class="flex items-center gap-2">
            <label class="flex-1 flex items-center justify-center gap-2 px-3 py-2 rounded-xl bg-white/70 border border-white/90 cursor-pointer hover:bg-white shadow-sm transition-all has-[:checked]:bg-indigo-600 has-[:checked]:border-indigo-600 has-[:checked]:text-white">
              <input type="checkbox" id="mat-pla" value="PLA" class="accent-indigo-500 w-4 h-4 rounded">
              <span class="text-xs font-bold">PLA</span>
            </label>
            <label class="flex-1 flex items-center justify-center gap-2 px-3 py-2 rounded-xl bg-white/70 border border-white/90 cursor-pointer hover:bg-white shadow-sm transition-all has-[:checked]:bg-indigo-600 has-[:checked]:border-indigo-600 has-[:checked]:text-white">
              <input type="checkbox" id="mat-petg" value="PETG" class="accent-indigo-500 w-4 h-4 rounded">
              <span class="text-xs font-bold">PETG</span>
            </label>
          </div>
        </div>

        <!-- 備註說明 -->
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">切片參數 / 備註說明</label>
          <textarea id="job-notes-input" rows="2" placeholder="例如：0.2mm 層高、需支撐、填充 30%..." class="w-full liquid-input px-3.5 py-2 text-sm"></textarea>
        </div>

        <div class="pt-3 border-t border-white/80 flex items-center justify-end gap-2.5">
          <button type="button" class="modal-close-btn px-4 py-2 rounded-full text-xs font-semibold text-slate-600 hover:text-slate-900 hover:bg-white/60 transition-colors">
            取消
          </button>
          <button type="submit" id="job-submit-btn" class="liquid-pill-violet px-6 py-2 text-xs font-bold tracking-wide">
            確認
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- 手機跨裝置同步中心 Modal (包含 QR Code) -->
  <div id="sync-modal" class="modal-backdrop fixed inset-0 z-50 bg-slate-900/35 backdrop-blur-md flex items-center justify-center p-4 hidden">
    <div class="modal-content-card liquid-glass-panel max-w-md w-full p-6 relative max-h-[90vh] overflow-y-auto bg-white/85">
      <div class="flex items-center justify-between pb-3 mb-4 border-b border-white/80">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-violet-600 to-indigo-500 text-white flex items-center justify-center shadow-md shadow-indigo-500/20">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
          </div>
          <div>
            <h3 class="text-base font-extrabold text-slate-900">手機跨裝置即時同步中心</h3>
            <p class="text-[11px] text-slate-500 font-medium">PC 與手機登入同一組金鑰，雙向隨時更新</p>
          </div>
        </div>
        <button type="button" class="modal-close-btn text-slate-500 hover:text-slate-800 p-1.5 rounded-full hover:bg-white/60 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <!-- 手機 QR Code 掃描區 -->
      <div class="liquid-inner-box p-5 text-center mb-5">
        <div class="text-xs font-bold text-slate-800 mb-1">拿起手機相機直接掃描</div>
        <p class="text-[11px] text-slate-500 mb-4 font-medium">手機開啟後自動完成管理者同步，在印表機旁隨時更新</p>
        
        <div class="qrcode-wrapper mx-auto">
          <div id="qrcode-container"></div>
        </div>

        <div class="mt-4 flex items-center justify-center gap-2">
          <button type="button" id="btn-copy-mobile-link" class="liquid-pill-white text-xs px-3.5 py-1.5 font-semibold flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
            複製手機專屬連結
          </button>
          <button type="button" id="btn-manual-sync" class="liquid-pill-violet text-xs px-3.5 py-1.5 font-semibold flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            立即雙向同步
          </button>
        </div>
      </div>

      <!-- 同步設定表單 -->
      <form id="sync-form" class="space-y-3.5">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">管理者專屬同步金鑰 (Sync Key)</label>
          <div class="flex items-center gap-2">
            <input type="text" id="sync-key-input" required class="flex-1 liquid-input px-3 py-2 text-sm font-mono tracking-wider">
            <button type="submit" class="liquid-pill-white px-4 py-2 text-xs font-bold">
              套用
            </button>
          </div>
          <p class="text-[10px] text-slate-500 mt-1 font-medium">此金鑰代表您的唯一管理者資料庫，手機與 PC 輸入同一把鑰匙即可互通。</p>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">當前同步狀態</label>
          <div id="modal-sync-status" class="liquid-inner-box px-3.5 py-2 text-xs font-mono text-emerald-600 font-bold">
            已就緒
          </div>
        </div>

        <details class="text-xs text-slate-600 pt-1 font-medium">
          <summary class="cursor-pointer hover:text-slate-900 select-none py-1">進階設定：自訂雲端端點 (Google Apps Script / Webhook)</summary>
          <div class="mt-2 space-y-2">
            <input type="url" id="custom-endpoint-input" placeholder="https://script.google.com/macros/s/.../exec" class="w-full liquid-input px-3 py-2 text-xs font-mono">
            <p class="text-[10px] text-slate-500">留空時自動使用預設極速雲端同步引擎。</p>
          </div>
        </details>
      </form>
    </div>
  </div>

  <script src="app.js?v=20261127_05"></script>
</body>
</html>
